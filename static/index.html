<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CourtClash | Enter the Chamber</title>
    <link rel="stylesheet" href="styles/main.css" />
    <script src="js/api-service.js" defer></script>
    <script src="js/index.js" defer></script>
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-shell" aria-labelledby="auth-title">
        <header class="brand-block">
          <div class="brand-mark" aria-hidden="true">
            <span class="brand-mark__icon">⚖</span>
          </div>

          <h1 id="auth-title" class="brand-title">CourtClash</h1>
          <p class="brand-subtitle">enter the chamber</p>
        </header>

        <section class="auth-card" aria-label="Sign in with Google">
          <button class="oauth-button" type="button">
            <span class="oauth-button__icon" aria-hidden="true">G</span>
            <span>Continue with Google</span>
          </button>

          <p class="auth-note">
            Sign in securely with your Google account to access the CourtClash
            debate chamber.
          </p>
        </section>
      </section>
    </main>
  </body>
</html>
